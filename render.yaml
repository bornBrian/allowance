# Render Blueprint for the hosted demonstration. See docs (ALW-SAD section 9).
# Keys are not stored here: Render asks for each "sync: false" value when the
# Blueprint is first applied, and keeps them as secret environment variables.
#
# Free plan: the service sleeps after 15 minutes without traffic (an uptime
# monitor pinging /api/health keeps it awake), and its disk is not persistent.
# Litestream keeps the data anyway: it restores the SQLite file from Backblaze B2
# when the server starts and copies every change back within a second
# (scripts/start.sh, litestream.yml). The hard limit on Claude spending is the
# Anthropic workspace's own spend limit; the in-app caps below are a second layer.
services:
  - type: web
    name: allowance
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build && sh scripts/get-litestream.sh
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # deploy main only after GitHub Actions pass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DAILY_AI_BUDGET_USD
        value: "0.25"
      - key: AI_TOTAL_BUDGET_USD
        value: "1"
      - key: CHANNEL3_MONTHLY_LIMIT
        value: "900"
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      - key: SANDBOX_BUYER_PASSWORD
        sync: false
      - key: LITESTREAM_URL
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
